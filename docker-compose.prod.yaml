services:
    laravel:
      build:
        context: .
        dockerfile: docker/Dockerfile
        target: production
      restart: unless-stopped
      env_file: .env
      environment:
        AUTORUN_ENABLED: "true"
        PHP_OPCACHE_ENABLE: 1
        PHP_UPLOAD_MAX_FILE_SIZE: 500M
      volumes:
        - storage:/var/www/html/storage
      depends_on:
        mysql:
          condition: service_healthy
        redis:
          condition: service_started
      networks:
        - laravel

    queue:
      build:
        context: .
        dockerfile: docker/Dockerfile
        target: production
      command: ["php", "/var/www/html/artisan", "queue:work", "--tries=3", "--timeout=180", "--max-time=3600"]
      restart: unless-stopped
      env_file: .env
      healthcheck:
        disable: true
      volumes:
        - storage:/var/www/html/storage
      depends_on:
        mysql:
          condition: service_healthy
        redis:
          condition: service_started
      networks:
        - laravel

    imports:
      build:
        context: .
        dockerfile: docker/Dockerfile
        target: production
      command: ["php", "/var/www/html/artisan", "queue:work", "--queue=imports", "--timeout=1800", "--tries=3", "--max-time=3600"]
      restart: unless-stopped
      env_file: .env
      healthcheck:
        disable: true
      volumes:
        - storage:/var/www/html/storage
      depends_on:
        mysql:
          condition: service_healthy
        redis:
          condition: service_started
      networks:
        - laravel

    scheduler:
      build:
        context: .
        dockerfile: docker/Dockerfile
        target: production
      command: ["php", "/var/www/html/artisan", "schedule:work"]
      restart: unless-stopped
      env_file: .env
      healthcheck:
        disable: true
      volumes:
        - storage:/var/www/html/storage
      depends_on:
        mysql:
          condition: service_healthy
        redis:
          condition: service_started
      networks:
        - laravel

    mysql:
      image: mysql:9.0
      restart: unless-stopped
      environment:
        MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
        MYSQL_DATABASE: ${DB_DATABASE}
        MYSQL_USER: ${DB_USERNAME}
        MYSQL_PASSWORD: ${DB_PASSWORD}
      volumes:
        - mysql-data:/var/lib/mysql
      healthcheck:
        test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${DB_USERNAME}", "-p${DB_PASSWORD}"]
        interval: 5s
        timeout: 5s
        retries: 20
      networks:
        - laravel

    redis:
      image: redis:7-alpine
      restart: unless-stopped
      volumes:
        - redis-data:/data
      networks:
        - laravel

    phpmyadmin:
      image: phpmyadmin:latest
      restart: unless-stopped
      environment:
        PMA_HOST: mysql
        PMA_PORT: 3306
        PMA_ABSOLUTE_URI: '${APP_URL}/phpmyadmin/'
        UPLOAD_LIMIT: 100M
      depends_on:
        mysql:
          condition: service_healthy
      networks:
        - laravel

    typesense:
      image: typesense/typesense:27.1
      restart: unless-stopped
      environment:
        TYPESENSE_DATA_DIR: /typesense-data
        TYPESENSE_API_KEY: ${TYPESENSE_API_KEY}
        TYPESENSE_ENABLE_CORS: 'false'
      volumes:
        - typesense-data:/typesense-data
      healthcheck:
        test: [ CMD, bash, -c, "exec 3<>/dev/tcp/localhost/8108 && printf 'GET /health HTTP/1.1\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep '200' && exec 3>&-" ]
        retries: 5
        timeout: 7s
      networks:
        - laravel

volumes:
  storage:
  mysql-data:
  redis-data:
  typesense-data:

networks:
  laravel:
    driver: bridge
